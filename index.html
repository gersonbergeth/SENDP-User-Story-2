<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEND-P — User Story 2</title>

  <!-- Fonts: Syne (display) + IBM Plex Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* =============================================
       CSS VARIABLES — CCS BRAND SYSTEM 2026
       ============================================= */
    :root {
      /* Primary palette */
      --black:       #000000;
      --navy:        #233047;
      --navy-mid:    #2d3d5c;
      --navy-dark:   #1a2438;
      --green:       #55734F;
      --cream:       #FFE8D5;
      --coral:       #FC927A;
      --burgundy:    #4C1515;
      /* Secondary palette */
      --sky:         #ADD5E1;
      --teal:        #2FA8A5;
      --teal-dark:   #1B6249;
      --amber:       #D88B09;
      --brown:       #603913;
      --muted-red:   #9A403F;
      /* Neutrals */
      --white:       #FFFFFF;
      --off-white:   #F8F7F5;
      --g50:         #F2F1EF;
      --g100:        #E8E6E2;
      --g200:        #D0CEC9;
      --g300:        #B0ADA6;
      --g400:        #8E8B83;
      --g500:        #6A6760;
      --g600:        #4A4840;
      --g700:        #2E2C26;
      /* Layout */
      --nav-h:       60px;
      --side-w:      304px;
      /* Type */
      --font-d: 'Syne', sans-serif;
      --font-b: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif;
    }

    /* =============================================
       RESET
       ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-b);
      background: var(--off-white);
      color: var(--g700);
      -webkit-font-smoothing: antialiased;
    }

    /* =============================================
       NAV
       ============================================= */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      z-index: 900;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-left { display: flex; align-items: center; gap: 18px; }
    .nav-logo { height: 26px; display: block; }
    .nav-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); }
    .nav-brand-name {
      font-family: var(--font-d); font-weight: 800; font-size: 13px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--white);
    }
    .nav-brand-name span { color: var(--coral); }
    .nav-brand-sub { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; margin-top: 1px; }
    .nav-tabs { display: flex; gap: 2px; margin-left: 8px; }
    .nav-tab {
      padding: 5px 13px; font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.45); border-radius: 6px; cursor: pointer;
      transition: all 0.15s; text-decoration: none;
    }
    .nav-tab:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.05); }
    .nav-tab.active { color: var(--white); background: rgba(255,255,255,0.10); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-role {
      padding: 3px 10px;
      background: rgba(252,146,122,0.12); border: 1px solid rgba(252,146,122,0.28);
      border-radius: 20px; font-size: 10px; font-weight: 600; color: var(--coral);
      letter-spacing: 0.04em;
    }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--coral) 0%, var(--burgundy) 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-d); font-size: 11px; font-weight: 700; color: white;
    }

    /* =============================================
       PAGE SHELL
       ============================================= */
    .page {
      position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
      display: flex; overflow: hidden;
    }

    /* =============================================
       SIDEBAR — FILTER (LIGHT / CREAM)
       ============================================= */
    .sidebar {
      width: var(--side-w); min-width: var(--side-w);
      background: var(--cream);
      display: flex; flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(35,48,71,0.12) transparent;
      border-right: 1px solid rgba(35,48,71,0.10);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(35,48,71,0.10); }

    /* Counter hero block */
    .counter-block {
      padding: 22px 20px 18px;
      border-bottom: 1px solid rgba(35,48,71,0.08);
    }
    .cb-eyebrow {
      font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(35,48,71,0.40); margin-bottom: 10px;
    }
    .cb-main { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 8px; }
    .cb-num {
      font-family: var(--font-d); font-size: 56px; font-weight: 800;
      line-height: 1; color: var(--burgundy);
      transition: all 0.35s ease;
    }
    .cb-lbl { font-size: 13px; font-weight: 400; color: rgba(35,48,71,0.55); padding-bottom: 7px; line-height: 1.3; }
    .cb-track { height: 2px; background: rgba(35,48,71,0.10); border-radius: 1px; overflow: hidden; }
    .cb-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--coral), var(--amber));
      border-radius: 1px; transition: width 0.4s ease;
    }
    .cb-sub { margin-top: 7px; font-size: 10px; color: rgba(35,48,71,0.38); }

    /* Filter sections */
    .filter-section { border-bottom: 1px solid rgba(35,48,71,0.07); }
    .fs-trigger {
      display: flex; align-items: center; gap: 11px;
      padding: 13px 20px; cursor: pointer; transition: background 0.12s;
    }
    .fs-trigger:hover { background: rgba(35,48,71,0.04); }
    .fs-dot {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1.5px solid rgba(35,48,71,0.20);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-d); font-size: 10px; font-weight: 700;
      color: rgba(35,48,71,0.35); flex-shrink: 0; transition: all 0.2s;
    }
    .filter-section.active .fs-dot { background: var(--teal); border-color: var(--teal); color: white; }
    .fs-meta { flex: 1; }
    .fs-name {
      font-family: var(--font-d); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: rgba(35,48,71,0.40); transition: color 0.2s;
    }
    .filter-section.active .fs-name { color: var(--navy); }
    .fs-sel { font-size: 10px; color: var(--teal-dark); margin-top: 2px; font-weight: 600; min-height: 14px; }
    .fs-chev { font-size: 9px; color: rgba(35,48,71,0.25); transition: transform 0.2s; }
    .filter-section.open .fs-chev { transform: rotate(90deg); }
    .fs-body { padding: 0 20px 14px; display: none; }
    .filter-section.open .fs-body { display: block; }

    /* Form elements in sidebar */
    .fl { font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(35,48,71,0.38); margin-bottom: 5px; margin-top: 10px; }
    .fl:first-child { margin-top: 0; }
    .ss {
      width: 100%; padding: 7px 26px 7px 10px;
      background: rgba(255,255,255,0.65); border: 1px solid rgba(35,48,71,0.15);
      border-radius: 7px; color: var(--navy);
      font-family: var(--font-b); font-size: 11px; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='9' height='5' viewBox='0 0 9 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L4.5 4L8 1' stroke='%23233047' stroke-opacity='0.4' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 9px center;
      cursor: pointer; margin-bottom: 5px; transition: border-color 0.15s;
    }
    .ss:hover { border-color: rgba(35,48,71,0.25); }
    .ss:focus { outline: none; border-color: var(--teal); }

    /* =============================================
       MAP CONTAINER
       ============================================= */
    .map-container {
      flex: 1; position: relative; overflow: hidden;
    }
    #map { width: 100%; height: 100%; }

    /* =============================================
       RESULTS PANEL (right side)
       ============================================= */
    .results {
      width: 340px; min-width: 340px;
      background: var(--white);
      border-left: 1px solid var(--g200);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .results-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--g100);
      background: var(--off-white);
    }
    .results-title {
      font-family: var(--font-d); font-size: 14px; font-weight: 700;
      color: var(--g700);
    }
    .results-list {
      flex: 1; overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(35,48,71,0.08) transparent;
    }
    .results-list::-webkit-scrollbar { width: 3px; }
    .results-list::-webkit-scrollbar-thumb { background: rgba(35,48,71,0.08); }
    .result-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--g100);
      cursor: pointer; transition: background 0.12s;
    }
    .result-item:hover { background: var(--g50); }
    .ri-name {
      font-family: var(--font-d); font-size: 12px; font-weight: 700;
      color: var(--navy); margin-bottom: 4px;
    }
    .ri-meta {
      font-size: 10px; color: var(--g500); line-height: 1.4;
    }
    .empty-state {
      padding: 60px 20px 20px;
      text-align: center; color: var(--g400);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="nav">
    <div class="nav-left">
      <svg class="nav-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="2"/>
        <text x="50" y="60" text-anchor="middle" fill="white" font-family="Syne, sans-serif" font-size="40" font-weight="800">P</text>
      </svg>
      <div class="nav-sep"></div>
      <div>
        <div class="nav-brand-name">SEND<span>-P</span></div>
        <div class="nav-brand-sub">USER STORY 2</div>
      </div>
    </div>
    <div class="nav-tabs">
      <a href="/" class="nav-tab active">Directory</a>
    </div>
    <div class="nav-right">
      <span class="nav-role">VIEWER</span>
      <div class="nav-avatar">GB</div>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="page">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="counter-block">
        <div class="cb-eyebrow">Total Results</div>
        <div class="cb-main">
          <div class="cb-num">0</div>
          <div class="cb-lbl">items</div>
        </div>
        <div class="cb-track">
          <div class="cb-fill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Filters will be populated here -->
      <div class="filter-section" style="padding: 20px;">
        <p style="color: rgba(35,48,71,0.55); font-size: 12px; text-align: center;">
          Filters will be defined for this page.
        </p>
      </div>
    </aside>

    <!-- MAP -->
    <div class="map-container">
      <div id="map"></div>
    </div>

    <!-- RESULTS -->
    <aside class="results">
      <div class="results-header">
        <div class="results-title">Results</div>
      </div>
      <div class="results-list">
        <div class="empty-state">
          No results yet. Define filters and populate data.
        </div>
      </div>
    </aside>
  </div>

  <script>
    // Initialize Leaflet map
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // TODO: Add data and interactivity
  </script>
</body>
</html>
